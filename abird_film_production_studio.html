=Object.entries(p.checks||{}).map(([group,vals])=>`<div class="pdf-field"><b>${esc(group.replace(/-/g,' '))}</b><p>${vals.map((v,i)=>(v?'☑':'☐')+' '+(v?'Done':'Pending')+' #'+(i+1)).join('<br>')}</p></div>`).join('');B+=pdfSection(t('checklist'),allChecks);return `<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><title>${esc(p.title)} — Abird Production Dossier</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link href="https://kriti.app/cdn/a03c1165.css" rel="stylesheet"><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{color:#151515;font:10pt/1.55 Inter,sans-serif}html[lang=bn] body{font-family:Bornomala,Inter,sans-serif}.cover{height:250mm;position:relative;display:flex;flex-direction:column;justify-content:center;border-bottom:7px solid #d9ff64;page-break-after:always}.mark{background:#d9ff64;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:25px;font-weight:900}.over{margin-top:27px;font-size:10pt;letter-spacing:.22em;font-weight:700}.cover h1{font-size:35pt;line-height:1.1;max-width:140mm;margin:12px 0}.cover p{font-size:15pt;color:#606060}.cover-foot{position:absolute;bottom:10mm;color:#666;letter-spacing:.12em}.pdf-section{margin:0 0 15mm;page-break-inside:auto}.pdf-section h2{font-size:20pt;margin:0 0 8mm;border-bottom:2px solid #d9ff64;padding-bottom:3mm}.pdf-section h3{font-size:12pt;margin:7mm 0 3mm}.pdf-field{margin:0 0 4mm;break-inside:avoid}.pdf-field b{font-size:8pt;color:#5e6672;text-transform:uppercase;letter-spacing:.05em}.pdf-field p{margin:1mm 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#888}table{width:100%;border-collapse:collapse;font-size:7.5pt;margin:3mm 0 5mm}th,td{border:1px solid #d8d8d8;padding:2mm;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#f1f2ed}.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5mm}.story{break-inside:avoid;border:1px solid #ccc;padding:3mm}.story-pic{aspect-ratio:16/9;background:#f8f8f8;border:1px solid #ccc}.story-pic img{width:100%;height:100%;object-fit:contain}.story h4{margin:2mm 0;font-size:10pt}.story p{margin:0;font-size:8pt;white-space:pre-wrap}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body>${B}</body></html>`}
